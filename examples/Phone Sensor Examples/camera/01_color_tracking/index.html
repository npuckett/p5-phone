<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Tracking - Mobile p5.js</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #101318;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #tracker-controls {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 20;
      display: grid;
      gap: 10px;
      padding: 12px;
      color: #f7f8fb;
      background: rgba(13, 16, 22, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(12px);
    }

    #tracker-controls label {
      display: grid;
      grid-template-columns: 76px 1fr auto;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    #target-color {
      width: 48px;
      height: 34px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 6px;
      background: transparent;
    }

    #tolerance {
      width: 100%;
      accent-color: #5ddf91;
    }

    #tolerance-readout {
      min-width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    #use-average {
      width: 100%;
      min-height: 42px;
      border: 0;
      border-radius: 7px;
      color: #101318;
      background: #f7f8fb;
      font: inherit;
      font-weight: 800;
    }

    @media (min-width: 620px) {
      #tracker-controls {
        left: 50%;
        right: auto;
        width: min(560px, calc(100vw - 32px));
        transform: translateX(-50%);
        grid-template-columns: 1fr 1fr auto;
        align-items: center;
      }

      #use-average {
        width: auto;
        padding: 0 18px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5-phone@1.11.0/dist/p5-phone.min.js"></script>
</head>
<body>
  <script src="sketch.js"></script>
</body>
</html>
