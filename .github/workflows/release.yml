name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    
    - name: Install dependencies
      run: npm install --only=dev 2>/dev/null || echo "No dependencies to install"
    
    - name: Run tests
      run: npm test
    
    - name: Validate files
      run: |
        echo "Validating release files..."
        ls -la src/
        test -f src/p5-phone.js
        echo "All required files exist ✓"

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          Changes in this Release
          - See CHANGELOG.md for details
          
          ## CDN Usage
          
          Release tag: `${{ github.ref_name }}`
          
          Replace `VERSION` with the npm version (tag without the leading `v`, e.g. `1.11.0`):
          
          ```html
          <script src="https://cdn.jsdelivr.net/npm/p5@2.2.3/lib/p5.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/p5.js-compatibility@0.2.0/src/preload.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/p5-phone@VERSION/dist/p5-phone.min.js"></script>
          ```
          
          Interactive examples: https://npuckett.github.io/p5-phone/examples/homepage/
        draft: false
        prerelease: false