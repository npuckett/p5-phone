# Compile every example across the supported board matrix.
# Catches #ifdef rot / API drift in the ArduinoBLE and NimBLE backends before
# any human has to flash a board. Uses the official arduino/compile-sketches action.

name: Compile Examples

on:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/compile-examples.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/compile-examples.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per supported board/FQBN. Each exercises its backend:
        #   - renesas_uno:unor4wifi, samd:nano_33_iot, mbed_nano:nano33ble → ArduinoBLE
        #   - esp32:esp32, esp32:esp32c3                                  → NimBLE
        board:
          - fqbn: arduino:renesas_uno:unor4wifi
            core: arduino:renesas_uno
          - fqbn: arduino:samd:nano_33_iot
            core: arduino:samd
          - fqbn: arduino:mbed_nano:nano33ble
            core: arduino:mbed_nano
          - fqbn: esp32:esp32:esp32
            core: esp32:esp32
          - fqbn: esp32:esp32:esp32c3
            core: esp32:esp32

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: |
            - name: ${{ matrix.board.core }}
              source-url: ${{ matrix.board.core == 'esp32:esp32' && 'https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json' || '' }}
          # Pull our own deps from Library Manager so the build sees them.
          libraries: |
            - name: ArduinoBLE
              source-url: ${{ contains(matrix.board.fqbn, 'esp32') && 'skip' || 'https://github.com/arduino-libraries/ArduinoBLE' }}
            - name: NimBLE-Arduino
              source-url: ${{ contains(matrix.board.fqbn, 'esp32') && 'https://github.com/h2zero/NimBLE-Arduino' || 'skip' }}
          sketch-paths: |
            - examples
          enable-deltas-report: true
          enable-warnings-report: false
