name=P5PhoneBLE
version=0.1.0
author=Nick Puckett / OCAD U
maintainer=Nick Puckett
sentence=Send and receive typed data between a p5.js sketch (p5-phone) and an Arduino over BLE.
paragraph=Companion peripheral library for the p5-phone Web Bluetooth module. Declare named, typed values (bool/int/float/string) and send or receive them with a simple set()/getX() API. Supports Arduino Nano 33 IoT, Nano 33 BLE, UNO R4 WiFi, and ESP32 / ESP32-S3 / ESP32-C3.
category=Communication
url=https://github.com/npuckett/P5PhoneBLE
architectures=samd,nrf52,renesas_uno,esp32
includes=P5PhoneBLE.h
depends=ArduinoBLE,NimBLE-Arduino
